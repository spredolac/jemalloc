name: Windows issue 3068 native validation

on:
  push:
    branches: [test/windows-3068-20261123-fda84135]

permissions:
  contents: read

concurrency:
  group: issue-3068-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: ${{ matrix.side }} / ${{ matrix.variant.id }}
    runs-on: windows-2025
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        side: [baseline, fixed]
        variant:
          - {id: msvc-x64, cc: cl.exe, cxx: cl.exe, arch: x64, flags: '', repro: true, suite: true}
          - {id: clangcl-x64, cc: clang-cl.exe, cxx: clang-cl.exe, arch: x64, flags: '', repro: true, suite: false}
          - {id: mingw-x64, cc: gcc, cxx: g++, arch: x64, flags: '', repro: true, suite: true}
          - {id: msvc-x86-debug, cc: cl.exe, cxx: cl.exe, arch: x86, flags: '--enable-debug', repro: false, suite: false}
          - {id: msvc-x64-debug-page128k, cc: cl.exe, cxx: cl.exe, arch: x64, flags: '--enable-debug --with-lg-page=17', repro: false, suite: false}
          - {id: msvc-x64-debug-dynamic64k, cc: cl.exe, cxx: cl.exe, arch: x64, flags: '--enable-debug --enable-dynamic-page-size', repro: false, suite: false, lg_page: '16'}
          - {id: msvc-x64-debug-nostats, cc: cl.exe, cxx: cl.exe, arch: x64, flags: '--enable-debug --disable-stats', repro: false, suite: false}
    env:
      BASELINE_SHA: 600de223cc1734cad698d52abf74cdf44b649431
      FIXED_SHA: 02652ca00d3682eb533316fd9756b328ce7adac8
      SIDE: ${{ matrix.side }}
      CONFIGURE_FLAGS: ${{ matrix.variant.flags }}
      EXPECT_LG_PAGE: ${{ matrix.variant.lg_page }}
      EXPECT_ARCH: ${{ matrix.variant.arch }}
      RUN_REPRO: ${{ matrix.variant.repro }}
      MSYS2_PATH_TYPE: inherit
      CC: ${{ matrix.variant.cc }}
      CXX: ${{ matrix.variant.cxx }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare baseline/fixed source and record runner details
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          if [[ $SIDE == fixed ]]; then
            git worktree add --detach ci-build "$FIXED_SHA"
          else
            git worktree add --detach ci-build "$BASELINE_SHA"
            git show "${FIXED_SHA}:test/unit/base.c" > ci-build/test/unit/base.c
          fi
          {
            printf 'side=%s baseline_sha=%s fixed_sha=%s workflow_sha=%s source_sha=%s\n' \
              "$SIDE" "$BASELINE_SHA" "$FIXED_SHA" "$GITHUB_SHA" "$(git -C ci-build rev-parse HEAD)"
            printf 'cc=%s cxx=%s flags=%s target_arch=%s lg_page_override=%s\n' \
              "$CC" "$CXX" "$CONFIGURE_FLAGS" "$EXPECT_ARCH" "${EXPECT_LG_PAGE:-default}"
            git -C ci-build status --short
            sha256sum ci-build/test/unit/base.c ci-tools/issue-3068-repro.c
            cmd.exe //c ver
            printf 'RUNNER_OS=%s RUNNER_ARCH=%s NUMBER_OF_PROCESSORS=%s PROCESSOR_ARCHITECTURE=%s\n' \
              "$RUNNER_OS" "$RUNNER_ARCH" "$NUMBER_OF_PROCESSORS" "$PROCESSOR_ARCHITECTURE"
          } | tee evidence/environment.log
      - uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c # v2
        with:
          msystem: MINGW64
          path-type: inherit
          update: true
          install: autotools git
          pacboy: 'make:p gcc:p binutils:p'
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        if: matrix.variant.cc != 'gcc'
        with:
          arch: ${{ matrix.variant.arch }}
      - name: Select the native clang-cl driver
        if: matrix.variant.cc == 'clang-cl.exe'
        shell: pwsh
        run: |
          $dir = Join-Path $env:ProgramFiles 'LLVM\bin'
          if (!(Test-Path (Join-Path $dir 'clang-cl.exe'))) {
            $dir = Split-Path (Get-Command clang-cl.exe -ErrorAction Stop).Source
          }
          $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build and run the focused test and arena commit reproducer
        id: focused
        shell: msys2 {0}
        run: bash ci-tools/issue-3068-windows.sh focused
      - name: Run the unmodified baseline or fixed full suite
        id: suite
        if: ${{ !cancelled() && matrix.variant.suite && steps.focused.outputs.configured == 'true' }}
        shell: msys2 {0}
        run: bash ci-tools/issue-3068-windows.sh suite
      - name: Upload raw evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.side }}-${{ matrix.variant.id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
